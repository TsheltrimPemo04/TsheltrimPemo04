  </path>
  <path fill="url(#g)" opacity=".5" d="M0 165 Q200 120 400 165 T800 165 T1200 165 V0 H0Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 165 Q200 120 400 165 T800 165 T1200 165 V0 H0Z;
              M0 175 Q200 210 400 175 T800 175 T1200 175 V0 H0Z;
              M0 165 Q200 120 400 165 T800 165 T1200 165 V0 H0Z"/>
  </path>
  <text class="t n" x="600" y="85">Tsheltrim Pemo</text>
  <text class="t d" x="600" y="122">AI &amp; Data Science  |  Frontend Developer  |  Technopreneur</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
