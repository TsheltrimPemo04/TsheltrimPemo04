<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7AA2F7"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle;opacity:0;animation:f 1.4s ease-out forwards}
      .n{font-size:56px;font-weight:700}
      .d{font-size:20px;font-weight:500;animation-delay:.5s}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="150" fill="url(#g)"/>
  <path fill="url(#g)" d="M0 150 Q150 200 300 150 T600 150 T900 150 T1200 150 V0 H0Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0 150 Q150 200 300 150 T600 150 T900 150 T1200 150 V0 H0Z;
              M0 160 Q150 120 300 160 T600 160 T900 160 T1200 160 V0 H0Z;
